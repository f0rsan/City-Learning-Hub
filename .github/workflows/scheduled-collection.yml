name: Scheduled collection refresh

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-collection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh collection data
        run: npm run collection:scheduled

      - name: Run unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/liveActivities.generated.ts docs/superpowers/reports/live-source-calibration-*.json
          if git diff --cached --quiet; then
            echo "No collection changes to commit."
          else
            git commit -m "chore: refresh Shenzhen activity collection"
            git push
          fi
